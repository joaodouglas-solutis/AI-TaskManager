app:
  ai:
    default-provider: ${AI_DEFAULT_PROVIDER:GEMINI}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/taskmanager
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        format_sql: false

  ai:
    model:
      chat: google-genai

    google:
      genai:
        api-key: ${GEMINI_API_KEY}

        chat:
          model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
          temperature: 0.1
          max-output-tokens: 256

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

      chat:
        model: ${OLLAMA_MODEL:qwen2.5:3b}
        keep-alive: 30m
        num-predict: 128
        num-ctx: 2048
        num-batch: 512
        num-thread: 6
        temperature: 0.1